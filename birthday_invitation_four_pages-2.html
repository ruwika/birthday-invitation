<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#a99c9c}
body{font-family:Arial,sans-serif}
#app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.page{width:min(100vw,560px);position:relative;line-height:0}
.page img{display:block;width:100%;height:auto}
.hit{position:absolute;display:block;border:0;padding:0;background:transparent;cursor:pointer;touch-action:manipulation}
.yes{left:4.9%;top:59.6%;width:40.5%;height:12.9%}
.no{left:53.5%;top:59.6%;width:40.4%;height:12.9%;transition:left .16s ease,top .16s ease}
.reaction{position:absolute;left:50%;top:74%;transform:translateX(-50%);color:#f8a0cd;background:#e2ffe2;border-radius:14px;padding:9px 13px;font:bold 13px/1.2 Arial,sans-serif;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px #0002}
.reaction.show{opacity:1}
.nav{width:min(100vw,560px);display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 10px calc(18px + env(safe-area-inset-bottom))}
.nav button{border:0;border-radius:999px;background:#f28fc3;color:#fff6d9;font-weight:800;font-size:14px;padding:12px 17px;cursor:pointer;touch-action:manipulation}
.nav button.secondary{background:#d66ba1}
[hidden]{display:none!important}
@media(min-width:561px){body{padding:18px 0}.page{box-shadow:0 8px 32px #0002}}
</style>

  </section>
  <nav id="detailsNav" class="nav" hidden aria-label="Details navigation">
    <button class="secondary" data-go="guests">← GUESTS</button>
    <button data-go="invitation">BACK TO INVITATION</button>
  </nav>
</main>
<script>
(() => {
  const pages = ['invitation', 'dressCode', 'guests', 'details'];
  const navs = {dressCode: 'dressNav', guests: 'guestsNav', details: 'detailsNav'};
  function showPage(id) {
    pages.forEach(page => { document.getElementById(page).hidden = page !== id; });
    Object.entries(navs).forEach(([page, nav]) => {
      document.getElementById(nav).hidden = page !== id;
    });
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  document.getElementById('yesButton').addEventListener('click', () => showPage('dressCode'));
  document.querySelectorAll('[data-go]').forEach(button => {
    button.addEventListener('click', () => showPage(button.dataset.go));
  });

  const invitation = document.getElementById('invitation');
  const noButton = document.getElementById('noButton');
  const reaction = document.getElementById('reaction');
  let attempts = 0;
  function dodge(event) {
    event.preventDefault();
    const bounds = invitation.getBoundingClientRect();
    const width = noButton.offsetWidth;
    const height = noButton.offsetHeight;
    const maxLeft = Math.max(0, bounds.width - width);
    const maxTop = Math.max(0, bounds.height - height);
    let left, top, tries = 0;
    do {
      left = Math.random() * maxLeft;
      top = Math.random() * maxTop;
      tries++;
    } while (tries < 12 &&
      Math.abs(left - noButton.offsetLeft) < width * 0.55 &&
      Math.abs(top - noButton.offsetTop) < height * 0.55);
    noButton.style.left = (left / bounds.width * 100) + '%';
    noButton.style.top = (top / bounds.height * 100) + '%';
    const messages = ['NICE TRY. TRY AGAIN.', 'THE NO BUTTON SAID: NO.', 'STILL NOT CATCHING IT.'];
    reaction.textContent = messages[Math.min(attempts++, messages.length - 1)];
    reaction.classList.add('show');
    clearTimeout(dodge.timer);
    dodge.timer = setTimeout(() => reaction.classList.remove('show'), 1100);
  }
  noButton.addEventListener('pointerdown', dodge);
  noButton.addEventListener('mouseenter', event => {
    if (event.pointerType !== 'touch') dodge(event);
  });
})();
</script>
